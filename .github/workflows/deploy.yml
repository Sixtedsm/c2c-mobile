name: Deploy to GitHub Pages

# Build on every push to main, deploy to gh-pages.
on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual re-deploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Don't queue up several runs — only the latest commit deploys.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # The repo lives at /<owner>/c2c-mobile, so pages serves it at
      # /c2c-mobile/. Vite needs the same base so generated asset URLs work.
      - name: Build
        env:
          VITE_BASE: /c2c-mobile/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
